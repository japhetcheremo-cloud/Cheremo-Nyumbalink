{% extends 'base.html' %}

{% block title %}Register - Cheremo NyumbaLink{% endblock %}

{% block content %}
<section class="min-h-[85vh] flex items-center justify-center bg-gray-50 py-16 relative overflow-hidden">
    <!-- Decorative blobs -->
    <div class="absolute -top-32 -left-32 w-96 h-96 rounded-full bg-brandBlue filter blur-[120px] opacity-25"></div>
    <div class="absolute -bottom-32 -right-32 w-96 h-96 rounded-full bg-brandGold filter blur-[120px] opacity-15"></div>

    <div class="relative w-full max-w-lg px-4 sm:px-6">
        <div class="bg-white rounded-3xl shadow-xl border border-gray-100 p-8 sm:p-10 flex flex-col">
            <!-- Header -->
            <div class="text-center mb-8">
                <span class="p-3 bg-brandGold/10 text-brandGold rounded-2xl inline-block mb-3">
                    <i class="fa-solid fa-user-plus text-2xl text-brandGold"></i>
                </span>
                <h1 class="text-2xl font-extrabold text-brandDark font-poppins">Create an Account</h1>
                <p class="text-xs text-gray-500 mt-1.5">Join the network to find houses or list your vacant rentals.</p>
            </div>

            <!-- Google Sign Up Button -->
            <a href="{% url 'google_login' %}" class="w-full bg-white border border-gray-250 hover:border-gray-400 text-gray-700 font-semibold py-3 px-4 rounded-xl flex items-center justify-center gap-3 transition shadow-sm hover:shadow-md group mb-5">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span class="text-sm font-semibold">Continue with Google</span>
            </a>

            <!-- Divider -->
            <div class="relative flex pb-5 items-center">
                <div class="flex-grow border-t border-gray-200"></div>
                <span class="flex-shrink mx-4 text-gray-400 text-[10px] uppercase tracking-widest font-semibold">Or register with</span>
                <div class="flex-grow border-t border-gray-200"></div>
            </div>

            <!-- Form -->
            <form action="{% url 'register' %}" method="POST" class="space-y-4">
                {% csrf_token %}
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="flex flex-col gap-1.5">
                        <label for="first_name" class="text-xs font-semibold text-gray-700">First Name</label>
                        <input type="text" name="first_name" id="first_name" required placeholder="e.g. Japhet"
                               class="bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brandBlue text-gray-800">
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <label for="last_name" class="text-xs font-semibold text-gray-700">Last Name</label>
                        <input type="text" name="last_name" id="last_name" required placeholder="e.g. Cheremo"
                               class="bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brandBlue text-gray-800">
                    </div>
                </div>

                <div class="flex flex-col gap-1.5">
                    <label for="username" class="text-xs font-semibold text-gray-700">Username</label>
                    <input type="text" name="username" id="username" required placeholder="Pick a unique username"
                           class="bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brandBlue text-gray-800">
                </div>

                <div class="flex flex-col gap-1.5">
                    <label for="email" class="text-xs font-semibold text-gray-700">Email Address</label>
                    <input type="email" name="email" id="email" required placeholder="name@example.com"
                           class="bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brandBlue text-gray-800">
                </div>

                <div class="flex flex-col gap-1.5">
                    <label for="phone" class="text-xs font-semibold text-gray-700">Phone Number</label>
                    <input type="tel" name="phone" id="phone" required placeholder="e.g. +254 719 678 760"
                           class="bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brandBlue text-gray-800">
                </div>

                <div class="flex flex-col gap-1.5">
                    <label for="role" class="text-xs font-semibold text-gray-700">I want to register as a:</label>
                    <select name="role" id="role" required
                            class="bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brandBlue text-gray-700">
                        <option value="tenant">Tenant (Looking for rental property)</option>
                        <option value="landlord">Landlord (Want to list rental property)</option>
                        <option value="agent">Property Agent (Manage multiple landlord listings)</option>
                    </select>
                </div>

                <div class="flex flex-col gap-1.5">
                    <label for="password" class="text-xs font-semibold text-gray-700">Secure Password</label>
                    <input type="password" name="password" id="password" required placeholder="••••••••"
                           class="bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brandBlue text-gray-800">
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full bg-brandBlue hover:bg-brandDark text-white font-bold py-3.5 rounded-xl transition shadow-md mt-4">
                    Create Account
                </button>
            </form>

            <!-- Bottom redirect -->
            <div class="border-t border-gray-100 pt-6 mt-6 text-center text-xs text-gray-500">
                Already have an account? <a href="{% url 'login' %}" class="font-bold text-brandBlue hover:underline">Sign in here</a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
